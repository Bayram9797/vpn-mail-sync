name: Sync Telegram Post to Gmail

on:
  repository_dispatch:
    types: [trigger_sync]
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Telegram parser and sender script
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python main.py

      - name: Keep repository active and save state
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add status.txt last_sent.txt
          git diff --staged --quiet || (git commit -m "Update sync status and post state" && git push)
